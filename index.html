<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a72f28"><meta name="apple-mobile-web-app-capable" content="yes"><title>Broken Tomatoes</title><link rel="icon" type="image/png" href="icone-broken-tomatoes.png"><link rel="apple-touch-icon" href="icone-broken-tomatoes.png"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--red:#ac382e;--green:#264d3f;--cream:#faf5ec;--ink:#272923;--muted:#77776f;--line:#e8dfd3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:var(--red);color:white;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;display:flex;justify-content:space-between;align-items:center}.brand-header{display:flex;align-items:center;gap:10px}.brand-header img{width:54px;height:54px;object-fit:contain;flex-shrink:0}.mascot-login{display:block;width:min(220px,70%);height:auto;margin:0 auto 8px;filter:drop-shadow(0 6px 12px #451b161c)}header h1{font-family:Georgia,serif;font-size:25px;margin:0}header small{opacity:.85}.wrap{max-width:760px;margin:auto;padding:18px 16px 115px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #46352508}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:11px}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:20px;background:#f5e5df;color:var(--red);font-size:12px;padding:5px 9px}.btn{background:var(--red);color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:650}.btn.alt{background:var(--green)}.btn.light{background:#f4eee5;color:var(--ink)}.btn:disabled{opacity:.5}input,select,textarea{width:100%;padding:12px;border:1px solid #d7d0c5;border-radius:11px;background:white;color:var(--ink)}label{font-size:13px;font-weight:650;display:block;margin-bottom:5px}.field{margin-bottom:12px}h2{font-family:Georgia,serif;margin:0 0 14px;font-size:25px}h3{margin:0 0 6px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:999}.nav button{flex:1;max-width:150px;border:0;back </style></head><body><div id="toast" role="status"></div><header><div class="brand-header"><img src="tomate-broken.png" alt="Mascote Broken Tomatoes"><div><h1>Broken Tomatoes</h1><small>Good food. Honest ratings.</small></div></div><button id="logout" class="btn light hidden" style="padding:8px">Sair</button></header><main class="wrap"><section id="login" class="login card"><img class="mascot-login" src="tomate-broken.png" alt="Tomate Broken Tomatoes"><div class="brand">Bem-vindo à Broken Tomatoes</div><p class="muted" style="text-align:center">Entra com o utilizador e a palavra-passe que o Amado te deu.</p><form id="loginForm"><div class="field"><label>Utilizador</label><input id="username" autocomplete="username" required placeholder="Ex.: Amado"></div><div class="field"><label>Palavra-passe</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%">Entrar</button></form><p id="loginError" class="muted" role="alert"></p><hr><button id="demoBtn" type="button" class="btn alt" style="width:100%">👀 Ver demonstração sem login</button><p class="muted" style="text-align:center">Dados fictícios. Não guarda alterações no Firebase.</p></section><section id="app" class="hidden"><div id="content"></div></section></main><nav id="nav" class="nav hidden"><button data-tab="explorar" class="active"><span class="emoji">🍽️</span>Explorar</button><button data-tab="visitei"><span class="emoji">⭐</span>Já fui</button><button data-tab="wishlist"><span class="emoji">❤️</span>Wishlist</button><button data-tab="mapa"><span class="emoji">🗺️</span>Mapa</button><button data-tab="amigos"><span class="emoji">👥</span>Amigos</button></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">

const firebaseConfig={apiKey:'AIzaSyBnpmGZy7d5_pvcQsnRoJPCy1D8vexcOk4',authDomain:'broken-tomatoes.firebaseapp.com',projectId:'broken-tomatoes',storageBucket:'broken-tomatoes.firebasestorage.app',messagingSenderId:'735396001186',appId:'1:735396001186:web:c9f0d46ad1aa196b106efb',measurementId:'G-R2ENJRDGN1'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const adminUID='HpIZgL0NYiNYNOe85D8xOwGdYAH3';const people=['Amado','Gama','Zé','Ricardo','Silvério','Carlota','Patrícia','Fabiana','Sofia','Catarina'];
const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]/g,'');const emailFor=s=>slug(s)+'@broken-tomatoes.invalid';const show=(msg,err=false)=>{let el=$('toast');el.textContent=msg;el.style.background=err?'#a32f28':'#264d3f';el.style.display='block';setTimeout(()=>el.style.display='none',4000)};
let user=null,tab='explorar',restaurants=[],reviews=[],wishes=[],profiles=[],unsubs=[],selected=null,map=null,markerLayer=null;const names=()=>Object.fromEntries(profiles.map(p=>[p.id,p.name]));const displayName=uid=>names()[uid]||(uid===adminUID?'Amado':'Utilizador');const avg=r=>['comida','servico','ambiente','qualidadePreco'].reduce((s,k)=>s+Number(r[k]||0),0)/4;const restReviews=id=>reviews.filter(r=>r.restaurantId===id);const score=id=>{let a=restReviews(id);return a.length?(a.reduce((s,r)=>s+avg(r),0)/a.length).toFixed(1).replace('.',','):'—'};const ownReview=id=>reviews.find(r=>r.restaurantId===id&&r.userId===user?.uid);const wished=id=>wishes.some(w=>w.restaurantId===id&&w.userId===user?.uid);const byId=id=>restaurants.find(r=>r.id===id);const sortR=()=>[...restaurants].sort((a,b)=>a.name.localeCompare(b.name,'pt'));
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';let name=$('username').value.trim();if(!people.some(p=>slug(p)===slug(name))){$('loginError').textContent='Utilizador não reconhecido.';return}try{await signInWithEmailAndPassword(auth,emailFor(name),$('password').value)}catch(err){$('loginError').textContent='Não foi possível entrar. Confirma o utilizador e a palavra-passe.'}};
let demoMode=false;
$('demoBtn').onclick=()=>{demoMode=true;user={uid:'demo-amado',email:'amado@broken-tomatoes.invalid'};profiles=people.map((name,i)=>({id:i===0?'demo-amado':'demo-'+i,name}));restaurants=[{id:'r1',name:'Pizzaria Bella',city:'Lisboa, Portugal',lat:38.7223,lng:-9.1393},{id:'r2',name:'Sushi House',city:'Porto, Portugal',lat:41.1496,lng:-8.6109},{id:'r3',name:'Trattoria Roma',city:'Roma, Itália',lat:41.9028,lng:12.4964},{id:'r4',name:'Bistro Paris',city:'Paris, França',lat:48.8566,lng:2.3522}];reviews=[{id:'v1',restaurantId:'r1',userId:'demo-amado',comida:9,servico:8,ambiente:9,qualidadePreco:8,price:'20–30 €',comment:'Ótimas pizzas!'},{id:'v2',restaurantId:'r1',userId:'demo-1',comida:8,servico:7,ambiente:9,qualidadePreco:7,price:'30–40 €',comment:'Ambiente muito agradável.'},{id:'v3',restaurantId:'r2',userId:'demo-2',comida:10,servico:9,ambiente:8,qualidadePreco:8,price:'30–40 €',comment:'Sushi excelente.'},{id:'v4',restaurantId:'r3',userId:'demo-3',comida:9,servico:9,ambiente:9,qualidadePreco:8,price:'40–50 €',comment:'Voltava sem dúvida.'}];wishes=[{id:'w1',restaurantId:'r3',userId:'demo-amado'},{id:'w2',restaurantId:'r4',userId:'demo-amado'},{id:'w3',restaurantId:'r2',userId:'demo-1'}];$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');$('logout').classList.remove('hidden');$('logout').textContent='Sair da demo';tab='explorar';selected=null;render();};
$('logout').onclick=()=>{if(demoMode){location.reload();return}signOut(auth)};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));function switchTab(t){tab=t;selected=null;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
onAuthStateChanged(auth,async u=>{if(demoMode)return;unsubs.forEach(f=>f());unsubs=[];user=u;restaurants=[];reviews=[];wishes=[];profiles=[];$('login').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);$('nav').classList.toggle('hidden',!u);$('logout').classList.toggle('hidden',!u);if(!u)return;try{let p=await getDoc(doc(db,'users',u.uid));if(!p.exists()){let found=people.find(x=>emailFor(x)===u.email);if(found)await setDoc(doc(db,'users',u.uid),{name:found});} }catch(e){show('Não foi possível criar/ler o perfil: verifica as regras.',true)}for(let [coll,assign] of [['restaurants',v=>restaurants=v],['reviews',v=>reviews=v],['wishlists',v=>wishes=v],['users',v=>profiles=v]]){unsubs.push(onSnapshot(collection(db,coll),snap=>{assign(snap.docs.map(d=>({id:d.id,...d.data()})));render()},err=>show('Sem acesso a '+coll+': verifica as regras Firestore.',true)))}render()});
function render(){if(!user)return;let el=$('content');if(selected){renderDetail(el,selected);return}if(tab==='explorar')renderExplore(el);if(tab==='visitei')renderVisited(el);if(tab==='wishlist')renderWishlist(el);if(tab==='mapa')renderMap(el);if(tab==='amigos')renderFriends(el)}
function card(r){return `<button class="restaurant" data-open="${safe(r.id)}"><div class="row"><strong>${safe(r.name)}</strong><span class="rating">⭐ ${score(r.id)}/10</span></div><div class="muted">${safe(r.city||'Localização por definir')} · ${restReviews(r.id).length} avaliação(ões)</div></button>`}function bindOpen(el){el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;render()})}function empty(s){return `<div class="empty">${safe(s)}</div>`}
function renderExplore(el){el.innerHTML=`<div class="row"><h2>Explorar restaurantes</h2><button class="btn" id="newRest">+ Novo</button></div><div class="field"><input id="filter" placeholder="Pesquisar por nome ou cidade..."></div><div id="restList" class="list"></div>`;$('newRest').onclick=()=>renderNewRestaurant(el);const fill=()=>{let s=$('filter').value.toLowerCase();$('restList').innerHTML=sortR().filter(r=>(r.name+' '+(r.city||'')).toLowerCase().includes(s)).map(card).join('')||empty('Ainda não há restaurantes. Adiciona o primeiro!');bindOpen(el)};$('filter').oninput=fill;fill()}
function renderNewRestaurant(el){if(demoMode){show('Demonstração: adicionar restaurantes fica disponível após login.',true);return}el.innerHTML=`<button class="btn light" id="back">← Voltar</button><h2 class="topspace">Novo restaurante</h2><div class="notice">Antes de criares, pesquisa em Explorar para evitar duplicados. A localização pode ser encontrada por pesquisa ou preenchida manualmente.</div><form id="newForm" class="card"><div class="field"><label>Nome</label><input name="name" required maxlength="100"></div><div class="field"><label>Cidade / País</label><input name="city" required maxlength="120" placeholder="Lisboa, Portugal"></div><button type="button" class="btn light" id="findPlace">📍 Procurar coordenadas</button><p id="geoResult" class="muted"></p><div class="two topspace"><div class="field"><label>Latitude</label><input name="lat" type="number" step="any" min="-90" max="90" placeholder="Opcional"></div><div class="field"><label>Longitude</label><input name="lng" type="number" step="any" min="-180" max="180" placeholder="Opcional"></div></div><button class="btn">Guardar restaurante</button></form>`;$('back').onclick=render;$('findPlace').onclick=async()=>{let f=$('newForm'),name=f.elements.name.value,city=f.elements.city.value;if(!name||!city){show('Preenche o nome e a cidade.',true);return}try{let res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=3&q='+encodeURIComponent(name+', '+city),{headers:{'Accept-Language':'pt'}});let list=await res.json();if(!list.length){$('geoResult').textContent='Não encontrado. Podes introduzir as coordenadas manualmente.';return}f.elements.lat.value=list[0].lat;f.elements.lng.value=list[0].lon;$('geoResult').textContent='Localização sugerida: '+list[0].display_name+' — confirma se é o restaurante certo.'}catch(e){$('geoResult').textContent='Pesquisa indisponível. Introduz coordenadas manualmente.'}};$('newForm').onsubmit=async e=>{e.preventDefault();let f=e.target,n=f.elements.name.value.trim(),city=f.elements.city.value.trim();if(restaurants.some(r=>slug(r.name)===slug(n)&&slug(r.city||'')===slug(city))){show('Já existe um restaurante com esse nome e cidade.',true);return}let lat=f.elements.lat.value,lng=f.elements.lng.value;try{await addDoc(collection(db,'restaurants'),{name:n,city,lat:lat===''?null:Number(lat),lng:lng===''?null:Number(lng),createdBy:user.uid,createdAt:Date.now()});show('Restaurante adicionado!');selected=null;render()}catch(err){show('Não foi possível guardar: '+err.message,true)}}}
function renderDetail(el,id){let r=byId(id);if(!r){selected=null;render();return}let rr=restReviews(id);el.innerHTML=`<button class="btn light" id="back">← Voltar</button><div class="card topspace"><div class="row"><h2>${safe(r.name)}</h2><span class="pill">⭐ ${score(id)}/10</span></div><p class="muted">📍 ${safe(r.city)} · ${rr.length} avaliação(ões)</p><div class="row" style="flex-wrap:wrap"><button class="btn" id="reviewBtn">${ownReview(id)?'Editar avaliação':'⭐ Avaliar'}</button><button class="btn alt" id="wishBtn">${wished(id)?'♥ Retirar da wishlist':'♡ Quero ir'}</button></div>${Number.isFinite(r.lat)&&Number.isFinite(r.lng)?`<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.lat+','+r.lng)}">🗺️ Abrir localização no mapa ↗</a></p>`:''}</div><h3>Avaliações dos amigos</h3><div class="list">${rr.length?rr.map(v=>`<div class="card"><div class="row"><strong>${safe(displayName(v.userId))}</strong><span class="rating">⭐ ${avg(v).toFixed(1).replace('.',',')}/10</span></div><p class="mini">🍽️ Comida ${v.comida}/10 · 🛎️ Serviço ${v.servico}/10<br>🕯️ Ambiente ${v.ambiente}/10 · 💶 Qualidade/preço ${v.qualidadePreco}/10</p><p class="muted">Preço por pessoa: ${safe(v.price||'Não indicado')}</p><p>${safe(v.comment||'Sem comentário')}</p></div>`).join(''):empty('Ainda não existem avaliações.')}</div>`;$('back').onclick=()=>{selected=null;render()};$('reviewBtn').onclick=()=>renderReview(el,r);$('wishBtn').onclick=async()=>{if(demoMode){show('Demonstração: wishlist só pode ser alterada após login.',true);return}try{let w=wishes.find(w=>w.restaurantId===id&&w.userId===user.uid);if(w)await deleteDoc(doc(db,'wishlists',w.id));else await setDoc(doc(db,'wishlists',user.uid+'_'+id),{userId:user.uid,restaurantId:id,createdAt:Date.now()});show(w?'Retirado da wishlist':'Adicionado à wishlist')}catch(e){show('Não foi possível alterar a wishlist.',true)}}}
function renderReview(el,r){if(demoMode){show('Demonstração: avaliar fica disponível após login.',true);return}let v=ownReview(r.id)||{},prices=Array.from({length:10},(_,i)=>`${i*10}–${(i+1)*10} €`).concat(['100 € ou mais']);el.innerHTML=`<button class="btn light" id="back">← Restaurante</button><h2 class="topspace">Avaliar ${safe(r.name)}</h2><form id="reviewForm" class="card">${[['comida','🍽️ Comida'],['servico','🛎️ Serviço'],['ambiente','🕯️ Ambiente'],['qualidadePreco','💶 Qualidade/preço']].map(([k,l])=>`<div class="field"><label>${l}</label><select name="${k}" required>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${Number(v[k]||8)===i+1?'selected':''}>${i+1}/10</option>`).join('')}</select></div>`).join('')}<div class="field"><label>Preço por pessoa</label><select name="price" required>${prices.map(p=>`<option ${v.price===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>Comentário (opcional)</label><textarea name="comment" rows="3" maxlength="1500">${safe(v.comment||'')}</textarea></div><button class="btn">Guardar avaliação</button></form>`;$('back').onclick=()=>renderDetail(el,r.id);$('reviewForm').onsubmit=async e=>{e.preventDefault();let f=e.target;let data={restaurantId:r.id,userId:user.uid,comida:Number(f.elements.comida.value),servico:Number(f.elements.servico.value),ambiente:Number(f.elements.ambiente.value),qualidadePreco:Number(f.elements.qualidadePreco.value),price:f.elements.price.value,comment:f.elements.comment.value.trim(),updatedAt:Date.now()};try{await setDoc(doc(db,'reviews',user.uid+'_'+r.id),data);show('Avaliação guardada!');renderDetail(el,r.id)}catch(err){show('Erro ao guardar: '+err.message,true)}}}
function renderVisited(el){let own=reviews.filter(r=>r.userId===user.uid);el.innerHTML=`<h2>⭐ Já fui</h2><p class="muted">As tuas avaliações (${own.length})</p><div class="list">${own.length?own.map(v=>byId(v.restaurantId)).filter(Boolean).map(card).join(''):empty('Ainda não avaliaste nenhum restaurante. Vai a Explorar!')}</div>`;bindOpen(el)}function renderWishlist(el,uid=user.uid){let ww=wishes.filter(w=>w.userId===uid);el.innerHTML=`<h2>❤️ ${uid===user.uid?'A minha wishlist':'Wishlist de '+safe(displayName(uid))}</h2><p class="muted">Restaurantes que ${uid===user.uid?'quero':'quer'} experimentar</p><div class="list">${ww.length?ww.map(w=>byId(w.restaurantId)).filter(Boolean).map(card).join(''):empty('A wishlist ainda está vazia.')}</div>`;bindOpen(el)}
function renderFriends(el){el.innerHTML=`<h2>👥 Amigos</h2><p class="muted">Consulta os restaurantes visitados e as wishlists de cada pessoa.</p><div class="list">${people.map(n=>{let p=profiles.find(p=>slug(p.name)===slug(n));return `<button class="restaurant" data-person="${safe(p?.id||'')}" ${!p?'disabled':''}><div class="row"><strong>👤 ${safe(n)} ${n==='Amado'?'👑':''}</strong><span class="muted">${p?'Ver perfil':'Ainda sem conta ativa'}</span></div></button>`}).join('')}</div>${user.uid===adminUID?'<div class="notice topspace">👑 Administração: as contas são criadas por ti na consola Firebase Authentication. A criação diretamente na app exige um serviço de administração seguro, que ainda não está configurado.</div>':''}`;el.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>renderPerson(el,b.dataset.person))}function renderPerson(el,uid){let own=reviews.filter(r=>r.userId===uid);el.innerHTML=`<button class="btn light" id="back">← Amigos</button><h2 class="topspace">👤 ${safe(displayName(uid))}</h2><div class="card"><h3>Já foi (${own.length})</h3><div class="list">${own.length?own.map(v=>byId(v.restaurantId)).filter(Boolean).map(card).join(''):empty('Sem avaliações.')}</div></div><div class="card"><h3>❤️ Wishlist</h3><div class="list">${wishes.filter(w=>w.userId===uid).map(w=>byId(w.restaurantId)).filter(Boolean).map(card).join('')||empty('Sem restaurantes na wishlist.')}</div></div>`;$('back').onclick=render;bindOpen(el)}
function renderMap(el){el.innerHTML=`<h2>🗺️ Mapa mundial</h2><p class="muted">Pins dos restaurantes com localização guardada. Toca num pin para abrir a ficha.</p><div class="field"><select id="mapFilter"><option value="all">Todos os restaurantes</option><option value="visited">Os que já visitei</option><option value="wish">A minha wishlist</option><option value="friends">Avaliados pelos amigos</option></select></div><div class="mapbox"><div id="map"></div></div><p class="muted topspace">Mapa © OpenStreetMap contributors.</p>`;if(typeof L==='undefined'){document.getElementById('map').innerHTML='<div class="empty">Mapa indisponível sem ligação à internet.</div>';return}if(map){map.remove();map=null}map=L.map('map').setView([38.72,-9.14],3);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);markerLayer=L.layerGroup().addTo(map);let draw=()=>{markerLayer.clearLayers();let mode=$('mapFilter').value;let list=restaurants.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng)).filter(r=>mode==='all'||(mode==='visited'&&!!ownReview(r.id))||(mode==='wish'&&wished(r.id))||(mode==='friends'&&restReviews(r.id).some(v=>v.userId!==user.uid)));let points=[];list.forEach(r=>{let marker=L.marker([r.lat,r.lng]).addTo(markerLayer);marker.bindPopup(`<strong>${safe(r.name)}</strong><br>${safe(r.city)}<br>⭐ ${score(r.id)}/10<br><button class="btn" style="margin-top:8px" id="pin_${r.id}">Ver restaurante</button>`);marker.on('popupopen',()=>{let b=document.getElementById('pin_'+r.id);if(b)b.onclick=()=>{selected=r.id;render()}});points.push([r.lat,r.lng])});if(points.length)map.fitBounds(points,{padding:[30,30],maxZoom:12});else map.setView([38.72,-9.14],3)};$('mapFilter').onchange=draw;draw();setTimeout(()=>map?.invalidateSize(),150)}
</script></body></html>
